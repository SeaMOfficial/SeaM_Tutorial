    <script>
      (() => {
        const root = document.documentElement;
        const opening = new Set(['open', 'line', 'objective', 'skipConfirm']);
        let closeTimer = 0;
        let showFrame = 0;

        const show = () => {
          window.clearTimeout(closeTimer);
          window.cancelAnimationFrame(showFrame);

          let attempts = 0;
          const revealWhenPainted = () => {
            if (document.querySelector('[data-ui="tutorial"]')) {
              root.dataset.seamUi = 'open';
              showFrame = 0;
              return;
            }

            attempts += 1;
            if (attempts < 120) showFrame = window.requestAnimationFrame(revealWhenPainted);
          };

          revealWhenPainted();
        };

        const hide = (delay = 0) => {
          window.clearTimeout(closeTimer);
          window.cancelAnimationFrame(showFrame);
          showFrame = 0;
          closeTimer = window.setTimeout(() => {
            root.dataset.seamUi = 'closed';
          }, delay);
        };

        root.dataset.seamUi = 'closed';

        window.addEventListener('message', event => {
          const action = event.data && event.data.action;
          if (opening.has(action)) show();
          if (action === 'close' || action === 'reset') hide(action === 'close' ? 260 : 0);
        }, true);

        window.addEventListener('DOMContentLoaded', () => {
          if (typeof GetParentResourceName !== 'function') return;

          let attempts = 0;
          const announceReady = () => {
            attempts += 1;

            fetch('https://' + GetParentResourceName() + '/ready', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: '{}',
            }).then(response => {
              if (!response.ok) throw new Error('NUI callback is not ready');
            }).catch(() => {
              if (attempts < 20) window.setTimeout(announceReady, 250);
            });
          };

          announceReady();
        }, { once: true });
      })();
    </script>
